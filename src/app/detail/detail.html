<section class="detail">
  <a class="detail__retour" routerLink="/accueil">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5" />
      <path d="M12 19l-7-7 7-7" />
    </svg>
    Retour à l'accueil
  </a>

  @if (film(); as f) {
    <article class="detail__fiche">
      <div class="detail__entete">
        <span class="detail__id">#{{ f.id }}</span>
        <span
          class="detail__statut"
          [ngClass]="{
            'detail__statut--a-voir': f.statut === 'à voir',
            'detail__statut--en-cours': f.statut === 'en cours',
            'detail__statut--vu': f.statut === 'vu'
          }">
          {{ f.statut }}
        </span>
      </div>

      <h1 class="detail__titre">{{ f.titre }}</h1>

      <dl class="detail__infos">
        <div>
          <dt>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
            Année
          </dt>
          <dd>{{ f.annee }}</dd>
        </div>
        <div>
          <dt>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Réalisateur
          </dt>
          <dd>{{ f.realisateur }}</dd>
        </div>
      </dl>

      <div class="detail__actions">
        <a class="detail__bouton" [routerLink]="['/film', f.id, 'modifier']">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z" />
          </svg>
          Modifier
        </a>

        <button type="button" class="detail__bouton detail__bouton--danger" (click)="supprimer(f.id)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
          Supprimer
        </button>
      </div>
    </article>
  } @else {
    <div class="detail__introuvable">
      <p>Ce film est introuvable.</p>
    </div>
  }
</section>
