<header class="header">
  <div class="header__inner">
    <a class="header__logo" routerLink="/accueil">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="2.5" />
        <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5" />
      </svg>
      <span>CinéListe</span>
    </a>

    <nav class="header__menu" aria-label="Navigation principale">
      <a routerLink="/accueil" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l9-8 9 8" />
          <path d="M5 10v10h14V10" />
          <path d="M10 20v-6h4v6" />
        </svg>
        Accueil
      </a>

      <a routerLink="/ajouter" routerLinkActive="actif">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Ajouter un film
      </a>
    </nav>
  </div>
</header>
